- defaults:
    link:
      relink: true

- shell:
  - command: chsh -s $(which zsh)
    stdin: true
    stdout: true
    stderr: true
    description: Making zsh the default shell
  - [git submodule update --init --recursive, Installing submodules]
  - [git submodule update --remote, Update all the submodules to the latest version]
  - command: |
      mkdir -p ./config/nvim/after/plugin
      cat >> ./config/nvim/lua/config/options.lua <<'EOF'
      -- Use system clipboard for all yank/put operations.
      vim.opt.clipboard = "unnamedplus"
      EOF
    description: Ensure Neovim uses the system clipboard
  
- clean: ['~']

- link:
    # zsh
    ~/.zshrc: ./config/zshrc
    # tmux
    ~/.tmux.conf : ./config/tmux.conf
    # p10k
    ~/.p10k.zsh : ./config/p10k.zsh
    # git
    ~/.gitconfig : ./config/gitconfig
    # neovim
    ~/.config/nvim : 
      create: true
      path: ./config/nvim
    # gdb
    ~/.config/gdb-dashboard/init : 
      create: true
      path: ./config/gdb-dashboard-init
    ~/.gdbinit : ./config/gdb-dashboard/.gdbinit
